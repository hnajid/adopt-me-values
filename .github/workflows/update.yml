name: Update Adopt Me values
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 scripts/update.py
      - name: Commit
        run: |
          git config user.name "Halim Najid"
          git config user.email "hnajid@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Daily values update $(date -u +%F)" && git push)
